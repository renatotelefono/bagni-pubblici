<!DOCTYPE html>
<html>
<head>
    <title>Air Quality Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; }
        .aqi-marker {
            background: white;
            border-radius: 50%;
            padding: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_KEY = '5c88e8d56a99f3c1a84f82284a4dec0e594d5b25';
        
        // Inizializza mappa centrata su Roma
        const map = L.map('map').setView([41.9028, 12.4964], 10);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Funzione per ottenere colore basato su AQI
        function getAQIColor(aqi) {
            if (aqi <= 50) return '#00e400';      // Good
            if (aqi <= 100) return '#ffff00';     // Moderate
            if (aqi <= 150) return '#ff7e00';     // Unhealthy for Sensitive
            if (aqi <= 200) return '#ff0000';     // Unhealthy
            if (aqi <= 300) return '#8f3f97';     // Very Unhealthy
            return '#7e0023';                      // Hazardous
        }
        
        // Carica dati per una città
        async function loadAirQuality(city) {
            try {
                const response = await fetch(
                    `https://api.waqi.info/feed/${city}/?token=${API_KEY}`
                );
                const data = await response.json();
                
                if (data.status === 'ok') {
                    const aqi = data.data.aqi;
                    const lat = data.data.city.geo[0];
                    const lon = data.data.city.geo[1];
                    
                    // Crea marker colorato
                    const marker = L.circleMarker([lat, lon], {
                        radius: 15,
                        fillColor: getAQIColor(aqi),
                        color: '#000',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);
                    
                    marker.bindPopup(`
                        <b>${data.data.city.name}</b><br>
                        AQI: ${aqi}<br>
                        ${data.data.dominentpol || 'N/A'}
                    `);
                }
            } catch (error) {
                console.error('Errore:', error);
            }
        }
        
        // Carica dati per Roma
        loadAirQuality('rome');
        
        // Oppure cerca stazioni nell'area visibile
        async function loadStationsInBounds() {
            const bounds = map.getBounds();
            const response = await fetch(
                `https://api.waqi.info/map/bounds/?latlng=${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}&token=${API_KEY}`
            );
            const data = await response.json();
            
            data.data.forEach(station => {
                const marker = L.circleMarker([station.lat, station.lon], {
                    radius: 10,
                    fillColor: getAQIColor(station.aqi),
                    color: '#000',
                    weight: 1,
                    fillOpacity: 0.8
                }).addTo(map);
                
                marker.bindPopup(`
                    <b>${station.station.name}</b><br>
                    AQI: ${station.aqi}
                `);
            });
        }
        
        // Carica stazioni quando la mappa è pronta
        map.on('moveend', loadStationsInBounds);
        loadStationsInBounds();
    </script>
</body>
</html>
