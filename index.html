<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Mie App</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: white;
      font-size: 2.5rem;
      margin-bottom: 3rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .app-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .app-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .app-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }

    .app-description {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.4;
    }

    .coming-soon {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .coming-soon:hover {
      transform: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .badge {
      display: inline-block;
      background: #f0f0f0;
      color: #666;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏠 Le Mie App</h1>
    
    <div class="app-grid">
      <a href="bagni-pubblici.html" class="app-card">
        <div class="app-icon">🚻</div>
        <div class="app-title">Bagni Pubblici</div>
        <div class="app-description">Trova i bagni pubblici più vicini a te</div>
      </a>

      <a href="incidenti-2022.html" class="app-card">
        <div class="app-icon">🚗</div>
        <div class="app-title">Incidenti 2022</div>
        <div class="app-description">Visualizza gli incidenti stradali a Roma nel 2022</div>
      </a>
      
      <a href="aria.html" class="app-card">
      
        <div class="app-icon">🏭</div>
        <div class="app-title">ARIA nel mondo</div>
        <div class="app-description">inquinamento nel mondo</div>
        </a>
     
 <a href="mappa_pericolosita.html" class="app-card">
      
        <div class="app-icon">👮</div>
        <div class="app-title">Crimini</div>
        <div class="app-description">Il crimine in Italia</div>
       </a>
        <a href="safety-map.html" class="app-card">
      
        <div class="app-icon">🚗</div>
        <div class="app-title">Incidenti H3</div>
        <div class="app-description">Visualizza gli incidenti stradali a Roma nel 2022</div>
       </a>
      </div>
    </div>
  </div>
</body>
</html>
