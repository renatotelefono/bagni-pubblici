<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2c7be5">
  <meta charset="utf-8" />
  <title>Bagni Pubblici Vicini</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="header">
    <a href="index.html" id="btn-home" title="Torna alla Home">🏠</a>
    <h1>🚻 Bagni Pubblici</h1>
  </div>

  <div id="controls">
    <button id="btn-gps">📍 Usa la mia posizione</button>
    <button id="btn-map">🗺️ Scegli sulla mappa</button>

    <select id="radius">
      <option value="1000">Entro 1 km</option>
      <option value="3000" selected>Entro 3 km</option>
      <option value="5000">Entro 5 km</option>
    </select>

    <button id="btn-search">🔍 Avvia ricerca</button>

    <div id="status">Scegli come cercare i bagni</div>
  </div>

  <div id="map"></div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 <script src="https://unpkg.com/h3-js@4.1.0"></script>
  <script src="map.js"></script>

  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js");
    });
  }
  </script>

</body>
</html>
