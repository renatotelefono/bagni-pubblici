<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Luoghi di Culto</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            max-width: 250px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .filter-section {
            margin-bottom: 15px;
        }
        .filter-section h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #333;
        }
        .filter-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 8px 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
        }
        button:hover {
            background: #0056b3;
        }
        button.active {
            background: #28a745;
        }
        .load-button {
            background: #dc3545;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }
        .load-button:hover {
            background: #c82333;
        }
        #loading {
            display: none;
            margin-top: 10px;
            color: #666;
            font-size: 12px;
        }
        #warning {
            display: none;
            margin-top: 10px;
            padding: 8px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            font-size: 11px;
            color: #856404;
        }
        .legend {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            border: 2px solid white;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="controls">
        <div class="filter-section">
            <h3>🛐 Filtro Religione</h3>
            <div class="filter-buttons">
                <button id="btn-all" class="active" onclick="setFilter('all')">🌍 Tutte le religioni</button>
                <button id="btn-christian" onclick="setFilter('christian')">✝️ Cristiane (tutte)</button>
                <button id="btn-catholic" onclick="setFilter('catholic')">⛪ Cattoliche</button>
                <button id="btn-orthodox" onclick="setFilter('orthodox')">☦️ Ortodosse</button>
                <button id="btn-protestant" onclick="setFilter('protestant')">📖 Protestanti</button>
                <button id="btn-muslim" onclick="setFilter('muslim')">🕌 Musulmane</button>
                <button id="btn-jewish" onclick="setFilter('jewish')">✡️ Ebraiche</button>
                <button id="btn-buddhist" onclick="setFilter('buddhist')">☸️ Buddiste</button>
                <button id="btn-hindu" onclick="setFilter('hindu')">🕉️ Induiste</button>
            </div>
        </div>
        
        <button class="load-button" onclick="caricaLuoghiCulto()">🔍 Carica Luoghi di Culto</button>
        <div id="loading">⏳ Caricamento in corso...</div>
        <div id="warning">⚠️ Zoom più vicino per vedere i poligoni</div>
        
        <div class="legend">
            <strong>Legenda colori:</strong>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #FFD700;"></div>
                <span>Cattolici</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #FF6347;"></div>
                <span>Ortodossi</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #9370DB;"></div>
                <span>Protestanti</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #4169E1;"></div>
                <span>Altri cristiani</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #228B22;"></div>
                <span>Musulmani</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #1E90FF;"></div>
                <span>Ebrei</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #FF8C00;"></div>
                <span>Buddisti</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #FF1493;"></div>
                <span>Induisti</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #808080;"></div>
                <span>Altri/Non specificato</span>
            </div>
        </div>
    </div>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([41.9028, 12.4964], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let currentFilter = 'all';
        
        const overpassServers = [
            'https://overpass.kumi.systems/api/interpreter',
            'https://overpass-api.de/api/interpreter'
        ];
        let currentServerIndex = 0;

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`btn-${filter}`).classList.add('active');
        }

        function passFilter(religion, denomination) {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'christian') return religion === 'christian';
            if (currentFilter === 'catholic') return religion === 'christian' && denomination === 'catholic';
            if (currentFilter === 'orthodox') return religion === 'christian' && denomination === 'orthodox';
            if (currentFilter === 'protestant') return religion === 'christian' && denomination === 'protestant';
            if (currentFilter === 'muslim') return religion === 'muslim';
            if (currentFilter === 'jewish') return religion === 'jewish';
            if (currentFilter === 'buddhist') return religion === 'buddhist';
            if (currentFilter === 'hindu') return religion === 'hindu';
            return false;
        }

        function getColor(religion, denomination) {
            if (religion === 'christian') {
                if (denomination === 'catholic') return '#FFD700';
                if (denomination === 'orthodox') return '#FF6347';
                if (denomination === 'protestant') return '#9370DB';
                return '#4169E1';
            }
            if (religion === 'muslim') return '#228B22';
            if (religion === 'jewish') return '#1E90FF';
            if (religion === 'buddhist') return '#FF8C00';
            if (religion === 'hindu') return '#FF1493';
            return '#808080';
        }

        async function caricaLuoghiCulto() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('warning').style.display = 'none';
            markersLayer.clearLayers();
            
            const bounds = map.getBounds();
            const zoom = map.getZoom();
            const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
            
            if (zoom < 14) {
                document.getElementById('warning').style.display = 'block';
            }
            
            console.log('Zoom:', zoom, 'Bbox:', bbox);
            
            // Query IDENTICA a quella di Overpass Turbo
            const query = `[out:json][timeout:90];
(
  node["amenity"="place_of_worship"](${bbox});
  way["amenity"="place_of_worship"](${bbox});
  relation["amenity"="place_of_worship"](${bbox});
);
out body;
>;
out skel qt;`;
            
            for (let i = 0; i < overpassServers.length; i++) {
                const serverUrl = overpassServers[currentServerIndex];
                console.log(`Tentativo con: ${serverUrl}`);
                
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 45000);
                    
                    const response = await fetch(serverUrl, {
                        method: 'POST',
                        body: query,
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log('✅ Dati ricevuti:', data.elements.length, 'elementi');
                    
                    processData(data, zoom);
                    return;
                    
                } catch (error) {
                    console.error(`❌ Errore con ${serverUrl}:`, error);
                    currentServerIndex = (currentServerIndex + 1) % overpassServers.length;
                    
                    if (i === overpassServers.length - 1) {
                        alert('Errore: impossibile caricare i dati. Riprova.');
                    }
                }
            }
            
            document.getElementById('loading').style.display = 'none';
        }

        function processData(data, zoom) {
            // Mappa dei nodi per ricostruire geometrie
            const nodes = {};
            const ways = {};
            
            // Prima passata: salva tutti i nodi e ways
            data.elements.forEach(element => {
                if (element.type === 'node') {
                    nodes[element.id] = { lat: element.lat, lon: element.lon };
                } else if (element.type === 'way') {
                    ways[element.id] = element;
                }
            });
            
            console.log(`📊 Nodi: ${Object.keys(nodes).length}, Ways: ${Object.keys(ways).length}`);
            
            let count = 0;
            let filteredCount = 0;
            
            // Seconda passata: processa gli elementi con tags
            data.elements.forEach(element => {
                if (!element.tags || element.tags.amenity !== 'place_of_worship') {
                    return;
                }
                
                const name = element.tags.name || 'Senza nome';
                const religion = element.tags.religion || '';
                const denomination = element.tags.denomination || '';
                
                count++;
                
                console.log(`🔍 [${count}] ${element.type} - ${name} (religion: ${religion})`);
                
                // Applica filtro
                if (currentFilter !== 'all' && (!religion || !passFilter(religion, denomination))) {
                    console.log(`  ⏭️  Filtrato`);
                    return;
                }
                
                filteredCount++;
                
                const color = getColor(religion, denomination);
                const popupContent = `
                    <strong>${name}</strong><br>
                    <em>Tipo:</em> ${element.type}<br>
                    <em>ID:</em> ${element.id}<br>
                    ${religion ? `<em>Religione:</em> ${religion}<br>` : ''}
                    ${denomination ? `<em>Denominazione:</em> ${denomination}<br>` : ''}
                    <a href="https://www.openstreetmap.org/${element.type}/${element.id}" target="_blank">Vedi su OSM</a>
                `;
                
                // GESTIONE NODE
                if (element.type === 'node') {
                    const icon = L.divIcon({
                        html: `<div style="background-color: ${color}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>`,
                        className: 'custom-marker',
                        iconSize: [12, 12]
                    });
                    
                    L.marker([element.lat, element.lon], { icon: icon })
                        .bindPopup(popupContent)
                        .addTo(markersLayer);
                    
                    console.log(`  ✅ Marker aggiunto`);
                }
                // GESTIONE WAY
                else if (element.type === 'way' && element.nodes) {
                    const latlngs = [];
                    element.nodes.forEach(nodeId => {
                        if (nodes[nodeId]) {
                            latlngs.push([nodes[nodeId].lat, nodes[nodeId].lon]);
                        }
                    });
                    
                    if (latlngs.length > 2) {
                        L.polygon(latlngs, {
                            color: color,
                            fillColor: color,
                            fillOpacity: 0.4,
                            weight: 2
                        })
                        .bindPopup(popupContent)
                        .addTo(markersLayer);
                        
                        console.log(`  ✅ Poligono aggiunto con ${latlngs.length} punti`);
                    }
                }
                // GESTIONE RELATION
                else if (element.type === 'relation' && element.members) {
                    console.log(`  🔄 Relation con ${element.members.length} membri`);
                    
                    element.members.forEach((member, idx) => {
                        console.log(`    Member ${idx}: type=${member.type}, role=${member.role}, ref=${member.ref}`);
                        
                        if (member.type === 'way' && ways[member.ref]) {
                            const way = ways[member.ref];
                            if (way.nodes) {
                                const latlngs = [];
                                way.nodes.forEach(nodeId => {
                                    if (nodes[nodeId]) {
                                        latlngs.push([nodes[nodeId].lat, nodes[nodeId].lon]);
                                    }
                                });
                                
                                if (latlngs.length > 2) {
                                    // Usa role per determinare se è outer o inner
                                    const isOuter = member.role === 'outer' || member.role === '';
                                    
                                    L.polygon(latlngs, {
                                        color: color,
                                        fillColor: color,
                                        fillOpacity: isOuter ? 0.4 : 0.1,
                                        weight: 2
                                    })
                                    .bindPopup(popupContent)
                                    .addTo(markersLayer);
                                    
                                    console.log(`    ✅ Poligono (${member.role}) aggiunto con ${latlngs.length} punti`);
                                }
                            }
                        }
                    });
                }
            });
            
            console.log(`\n📊 TOTALE: ${count} trovati, ${filteredCount} visualizzati`);
            alert(`Trovati ${count} luoghi di culto.\nVisualizzati ${filteredCount} con filtro "${currentFilter}".`);
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
